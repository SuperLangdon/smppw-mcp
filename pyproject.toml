[project]
name = "smppw-mcp"
version = "0.1.0"
description = "私募排排网 MCP server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
    "pycryptodome>=3.20",
]

[project.scripts]
smppw-mcp = "ppw_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ppw_mcp*"]
